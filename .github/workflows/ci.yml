name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: for f in lib/*.js test/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test test/events.test.mjs test/host-routes.test.mjs test/transport.test.mjs

  # The real-backend matrix needs one DSH release per generation. It is kept as
  # a manual job because it downloads several hundred MB from npm.
  matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the current DSH and older releases
        run: |
          npm i -g @deepseek-ai/dsh@latest
          mkdir -p /tmp/compat/v0 /tmp/compat/v2 /tmp/compat/v3
          for pair in "v0 0.1.1-rc.2" "v2 0.1.3-alpha.2" "v3 0.1.6-alpha.2"; do
            set -- $pair
            cd /tmp/compat/$1
            npm init -y >/dev/null
            npm i --no-audit --no-fund --legacy-peer-deps \
              @deepseek-ai/dsh-base@$2 @deepseek-ai/dsh-session-persistence@$2 \
              @deepseek-ai/dsh-session-persistence-jsonl@$2 @deepseek-ai/dsh-scope@$2 \
              @deepseek-ai/dsh-invariants@$2 @deepseek-ai/cordis@4.0.1
          done
      - name: Run the matrix
        run: CURRENT_DSH="$(npm root -g)/@deepseek-ai/dsh" sh test/matrix.sh
